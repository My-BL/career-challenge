<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Career Challenge</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:white;
  background:#090d18;
  min-height:100vh;
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 10%,#263b72 0,transparent 35%),
    radial-gradient(circle at 90% 80%,#4b216b 0,transparent 35%),
    linear-gradient(145deg,#080b15,#11182b);
  z-index:-1;
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px;
  max-width:800px;
  margin:auto;
}
.logo{
  font-weight:900;
  letter-spacing:1px;
}
.score{
  background:#ffffff18;
  padding:9px 15px;
  border-radius:20px;
  backdrop-filter:blur(10px);
}
main{
  max-width:800px;
  margin:auto;
  padding:25px 20px 100px;
}
.screen{display:none;text-align:center}
.screen.active{display:block}
.card{
  background:#ffffff12;
  border:1px solid #ffffff20;
  border-radius:30px;
  padding:35px 22px;
  box-shadow:0 20px 60px #0006;
  backdrop-filter:blur(18px);
}
.glow{
  font-size:65px;
  animation:pulse 1.8s infinite alternate;
}
h1{
  font-size:clamp(38px,10vw,70px);
  line-height:1;
  margin:15px 0;
}
h1 span{
  background:linear-gradient(90deg,#72d5ff,#c77dff);
  -webkit-background-clip:text;
  color:transparent;
}
p{
  color:#bfc8dc;
  font-size:18px;
}
button{
  border:0;
  cursor:pointer;
  font-size:18px;
  font-weight:800;
  border-radius:18px;
  padding:17px 25px;
}
.primary{
  width:100%;
  margin-top:25px;
  color:white;
  background:linear-gradient(90deg,#4d7cff,#a25cff);
  box-shadow:0 10px 30px #6b5cff55;
}
.secondary{
  width:100%;
  margin-top:12px;
  color:white;
  background:#ffffff12;
}
.jobs{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:25px;
}
.job{
  padding:20px 10px;
  border-radius:20px;
  background:#ffffff10;
  border:1px solid #ffffff18;
}
.job-icon{font-size:42px}
.job-name{font-weight:800;margin-top:8px}
#jobIcon{font-size:75px}
#jobName{font-size:40px;margin:10px}
.progress{
  height:8px;
  background:#ffffff18;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:25px;
}
.progress div{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#5c8cff,#c45cff);
  transition:.4s;
}
.question{
  font-size:27px;
  line-height:1.3;
  margin:25px 0;
}
.answers{
  display:grid;
  gap:12px;
}
.answer{
  width:100%;
  color:white;
  background:#ffffff12;
  border:1px solid #ffffff20;
  text-align:left;
  transition:.2s;
}
.answer:active{transform:scale(.97)}
.correct{background:#18a66b!important}
.wrong{background:#c63d52!important}
.big-score{
  font-size:80px;
  font-weight:900;
  background:linear-gradient(90deg,#ffd76a,#ff8ad8);
  -webkit-background-clip:text;
  color:transparent;
}
@keyframes pulse{
  from{transform:scale(1)}
  to{transform:scale(1.08) rotate(3deg)}
}
@media(max-width:500px){
  main{padding-top:10px}
  .card{padding:28px 17px}
}
</style>
</head>

<body>

<header>
  <div class="logo">⚡ CAREER CHALLENGE</div>
  <div class="score">⭐ <span id="score">0</span></div>
</header>

<main>

<!-- หน้าแรก -->
<section id="home" class="screen active">
  <div class="card">
    <div class="glow">🎮</div>

    <h1>
      CAREER<br>
      <span>CHALLENGE</span>
    </h1>

    <p>
      สุ่มอาชีพ แล้วทำภารกิจให้สำเร็จ!
    </p>

    <button class="primary" onclick="startGame()">
      🎲 เริ่มเกม
    </button>

    <div class="jobs">
      <div class="job">
        <div class="job-icon">👨‍💻</div>
        <div class="job-name">โปรแกรมเมอร์</div>
      </div>
      <div class="job">
        <div class="job-icon">🎨</div>
        <div class="job-name">นักออกแบบ</div>
      </div>
      <div class="job">
        <div class="job-icon">🩺</div>
        <div class="job-name">หมอ</div>
      </div>
      <div class="job">
        <div class="job-icon">👨‍🍳</div>
        <div class="job-name">เชฟ</div>
      </div>
    </div>
  </div>
</section>


<!-- สุ่มอาชีพ -->
<section id="career" class="screen">
  <div class="card">
    <div class="glow">🎲</div>

    <p>อาชีพที่คุณได้รับคือ...</p>

    <div id="jobIcon">❓</div>

    <h2 id="jobName">กำลังสุ่ม...</h2>

    <p id="jobDescription"></p>

    <button class="primary" onclick="startQuiz()">
      🚀 เริ่มภารกิจ
    </button>
  </div>
</section>


<!-- เกม -->
<section id="game" class="screen">

  <div class="progress">
    <div id="progressBar"></div>
  </div>

  <p>
    ภารกิจ <span id="questionNumber">1</span>/5
  </p>

  <div class="card">

    <div id="missionIcon" class="glow">
      🧩
    </div>

    <div id="question" class="question">
      ...
    </div>

    <div id="answers" class="answers"></div>

  </div>

</section>


<!-- ผลลัพธ์ -->
<section id="result" class="screen">

  <div class="card">

    <div class="glow">🏆</div>

    <h1>จบภารกิจ!</h1>

    <div class="big-score" id="finalScore">
      0
    </div>

    <p id="resultText"></p>

    <button class="primary" onclick="startGame()">
      🔄 เล่นอีกครั้ง
    </button>

    <button class="secondary" onclick="show('home')">
      🏠 หน้าแรก
    </button>

  </div>

</section>

</main>


<script>

const careers = [
  {
    name:"โปรแกรมเมอร์",
    icon:"👨‍💻",
    desc:"สร้างเว็บไซต์ แอป และเกมด้วยการเขียนโปรแกรม"
  },
  {
    name:"นักออกแบบ",
    icon:"🎨",
    desc:"ออกแบบภาพ UI และประสบการณ์ของผู้ใช้งาน"
  },
  {
    name:"คุณหมอ",
    icon:"🩺",
    desc:"ดูแลและช่วยเหลือผู้ป่วย"
  },
  {
    name:"เชฟ",
    icon:"👨‍🍳",
    desc:"สร้างสรรค์อาหารและเมนูใหม่ ๆ"
  },
  {
    name:"นักธุรกิจ",
    icon:"💼",
    desc:"วางแผนธุรกิจและสร้างโอกาสใหม่"
  },
  {
    name:"นักบิน",
    icon:"✈️",
    desc:"ควบคุมเครื่องบินและดูแลความปลอดภัย"
  }
];

const questions = [
  {
    icon:"💻",
    q:"ภาษาใดนิยมใช้สร้างเว็บไซต์?",
    a:["HTML","C++","Python","SQL"],
    correct:0
  },
  {
    icon:"🎨",
    q:"สีใดเกิดจากการผสมสีน้ำเงินกับสีเหลือง?",
    a:["แดง","เขียว","ม่วง","ส้ม"],
    correct:1
  },
  {
    icon:"🧠",
    q:"ข้อใดเป็นทักษะสำคัญในการทำงานเป็นทีม?",
    a:["การสื่อสาร","การนอน","การหลีกเลี่ยงคนอื่น","การไม่ฟังใคร"],
    correct:0
  },
  {
    icon:"💼",
    q:"สิ่งใดช่วยให้การทำงานสำเร็จตามเป้าหมาย?",
    a:["การวางแผน","การเดาสุ่ม","การผัดวัน","การไม่ตรวจงาน"],
    correct:0
  },
  {
    icon:"🏆",
    q:"เมื่อทำผิดพลาด สิ่งใดดีที่สุด?",
    a:["เลิกทันที","โทษคนอื่น","เรียนรู้และแก้ไข","ไม่สนใจ"],
    correct:2
  }
];

let career;
let current=0;
let score=0;

function show(id){
  document.querySelectorAll(".screen")
    .forEach(x=>x.classList.remove("active"));

  document.getElementById(id)
    .classList.add("active");

  window.scrollTo(0,0);
}

function startGame(){

  score=0;
  current=0;

  document.getElementById("score").textContent=0;

  career=careers[
    Math.floor(Math.random()*careers.length)
  ];

  document.getElementById("jobIcon").textContent=career.icon;
  document.getElementById("jobName").textContent=career.name;
  document.getElementById("jobDescription").textContent=career.desc;

  show("career");
}

function startQuiz(){

  current=0;
  score=0;

  show("game");
  loadQuestion();
}

function loadQuestion(){

  const q=questions[current];

  document.getElementById("questionNumber")
    .textContent=current+1;

  document.getElementById("progressBar")
    .style.width=((current)/questions.length*100)+"%";

  document.getElementById("missionIcon")
    .textContent=q.icon;

  document.getElementById("question")
    .textContent=q.q;

  const box=document.getElementById("answers");

  box.innerHTML="";

  q.a.forEach((answer,index)=>{

    const btn=document.createElement("button");

    btn.className="answer";
    btn.textContent=answer;

    btn.onclick=()=>answerQuestion(btn,index);

    box.appendChild(btn);

  });
}

function answerQuestion(button,index){

  const q=questions[current];

  document
    .querySelectorAll(".answer")
    .forEach(b=>b.disabled=true);

  if(index===q.correct){

    button.classList.add("correct");

    score+=100;

  }else{

    button.classList.add("wrong");

    document
      .querySelectorAll(".answer")[q.correct]
      .classList.add("correct");

  }

  document.getElementById("score")
    .textContent=score;

  setTimeout(()=>{

    current++;

    if(current<questions.length){

      loadQuestion();

    }else{

      finishGame();

    }

  },800);
}

function finishGame(){

  document.getElementById("finalScore")
    .textContent=score;

  let text="";

  if(score===500){
    text="🔥 สุดยอด! คุณทำภารกิจสำเร็จทุกข้อ!";
  }else if(score>=300){
    text="👏 เยี่ยมมาก! คุณมีทักษะที่ดี!";
  }else{
    text="💪 ลองอีกครั้งเพื่อทำคะแนนให้สูงขึ้น!";
  }

  document.getElementById("resultText")
    .textContent=text;

  show("result");
}

</script>

</body>
</html>
